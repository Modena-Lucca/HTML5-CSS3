<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'love';
            src: url(fonts/Chandia_PERSONAL_USE_ONLY.otf) format('opentype')
            /*
            Tipos de format()
            - opentype (otf)
            -truetype(ttf)
            -embed-opentype
            -truetype-aat (Apple Advanced Typography)
            -svg
            */
        }
        
        h1{
            font-family: 'love';
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Fontes externas</h1>
</body>
</html>
