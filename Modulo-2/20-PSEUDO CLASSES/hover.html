<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        #interacao:hover{
            color: red
        }

        #interacao:hover > p{
            display: block;
            color: blue;
        }

        #interacao > p{
            display: none;
        }
        
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <div>
        <p>passe o mouse sobre o texto abaixo</p>
    </div>
    <div id="interacao">
        Passe o mouse aqui
        <p>TEXTO ESCONDIDO...</p>
    </div>
</body>
</html>
