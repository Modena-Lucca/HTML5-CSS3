<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Tags</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: blanchedalmond;
            margin: 0px;
        }

        header{
            background-color: beige;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }
        nav{
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.549);
            background-color: bisque;
            padding: 10px;
            border-radius: 3px;

        }

        nav:hover{
            background-color: burlywood;
        }

        main{
            background-color: beige;
            padding: 10px;
            margin: 10px;
        }

        footer{
            background-color: burlywood;
            color: white;
            text-align: center;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu site</h1>
        <nav>
            <a href="">Link</a>
            <a href="">Link</a>
            <a href="">Link</a>
            <a href="">Link</a>
        </nav>
    </header>
    <main>
        <section id="assuntos">
            <article>
                <aside>
                    <p>Teste teste teste</p>
                </aside>
            </article>
        </section>
        <section id="noticias">

        </section>
    </main>
    <footer>
        <p>Desenvolvido por Lukaneta</p>
    </footer>
</body>
</html>
