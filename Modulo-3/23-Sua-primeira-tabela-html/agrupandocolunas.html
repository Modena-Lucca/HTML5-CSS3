<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabelat</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 600px;
        }

        caption{
            padding: 10px;
            font-size: 1.3em;
        }

        td,th {
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

        .destaque{

        }

        .cnome{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Exercício de tabela</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>
            Cadastro
        </caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Jorge Amado</td>
            <td>M</td>
            <td>26</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Pedro Batista</td>
            <td>M</td>
            <td>45</td>
            <td>Jogador</td>
        </tr>
        <tr>
            <td>Ana Beatriz</td>
            <td>F</td>
            <td>18</td>
            <td>Camera</td>
        </tr>
        <tr>
            <td>Gabriel Albuqerque</td>
            <td>M</td>
            <td>30</td>
            <td>Microfoner</td>
        </tr>
    </table>
</body>
</html>
