<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imax"><label for="imax">Maculino</label><br>
            <input type="radio" name="sexo" id="ife"><label for="ife">Feminino</label>
        </fieldset>

        <fieldset>
            <legend>Esportes Favorítos</legend>
            <input type="checkbox" name="" id="ifut"> <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="" id="ibas"> <label for="ibas">Basquete</label><br>
            <input type="checkbox" name="" id="if1"> <label for="if1">Formula 1</label><br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
