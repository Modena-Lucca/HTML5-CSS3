<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="icor">Cor:</label>
            <input type="color" name="" id="icor">
        </p>
        <p>
            <label for="inivel">Nível de Satisfação:</label>
            <input type="range" name="" id="inivel" min="1" max="5" value="3">
        </p>
        <p>
            <label for="ifoto">Foto de arquivo:</label>
            <input type="file" name="" id="ifoto">
        </p>
    </form>
</body>
</html>
